tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: gitlab.example.com
    path: /.well-known/*
    service: http://nginx-proxy-manager
  - hostname: gitlab.example.com
    path: /oauth/discovery/keys
    service: http://nginx-proxy-manager
  - service: http_status:404
