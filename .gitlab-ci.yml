# Account vending pipeline. Required CI/CD variables:
#   CI_ROLE_ARN                - ARN of the gitlab-ci role (output of 01-management-init-role-and-hardening)
#   STATE_BUCKET               - central state bucket (output of 00-backend)
#   STATE_REGION               - state bucket region (default ap-southeast-3)
#   ACCOUNT_FACTORY_PRODUCT_ID - Service Catalog product ID of Control Tower Account Factory
#   security_contact_{name,email,phone} billing_contact_{name,email,phone}
#   operations_contact_{name,email,phone} - bootstrap alternate contact values
stages:
  - validate
  - provision
  - bootstrap

variables:
  AWS_DEFAULT_REGION: us-west-2

.tofu:
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    OIDC_TOKEN:
      aud: https://gitlab.prolifel.com
  before_script:
    - |
      set -e
      command -v dnf >/dev/null 2>&1 || true
      dnf install -y unzip jq ruby >/dev/null 2>&1 || true
      curl -fsSL -o /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.8.0/tofu_1.8.0_linux_amd64.zip
      unzip -o /tmp/tofu.zip -d /usr/local/bin/
      command -v yq >/dev/null 2>&1 || { curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64; chmod +x /usr/local/bin/yq; }
      creds=$(aws sts assume-role-with-web-identity \
        --role-arn "$CI_ROLE_ARN" \
        --role-session-name "ci-$CI_PIPELINE_ID" \
        --web-identity-token "$OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
      read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$creds"
      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

validate:
  extends: .tofu
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 02-accounts-creation/**
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - 02-accounts-creation/**
  script:
    - scripts/validate-accounts.sh 02-accounts-creation
  artifacts:
    paths:
      - account-reports/validation.json
    expire_in: 1 day

provision:
  extends: .tofu
  stage: provision
  resource_group: account-vending
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - 02-accounts-creation/**
  script:
    - scripts/account-factory.sh 02-accounts-creation
  artifacts:
    paths:
      - account-reports/account-factory.json
    expire_in: 1 day

bootstrap:
  extends: .tofu
  stage: bootstrap
  resource_group: account-bootstrap
  needs:
    - provision
  script:
    - scripts/account-bootstrap.sh
  artifacts:
    when: always
    paths:
      - account-reports/bootstrap*.json
    expire_in: 1 day
